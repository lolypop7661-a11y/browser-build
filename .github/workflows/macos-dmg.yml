name: Build Browsery macOS installers

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Browsery-mac-build-kit-1.0.0

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron
        run: node node_modules/electron/install.js
      - name: Build Apple Silicon and Intel DMGs
        run: pnpm package:mac
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: Browsery-macOS-installers
          path: Browsery-mac-build-kit-1.0.0/outputs/macos/*-unnotarized.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish DMG release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v1.0.0-macos
          --target "$GITHUB_SHA"
          --title "Browsery 1.0.0 for macOS"
          --notes "Browsery disk images for macOS. Choose arm64 for Apple Silicon (M1/M2/M3/M4) or x64 for Intel Macs. This release is not Apple-notarized."
          outputs/macos/*.dmg
