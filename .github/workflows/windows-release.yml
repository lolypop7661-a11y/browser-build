name: Publish Browsery for Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example v1.0.5)'
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: Browsery-mac-build-kit-1.0.0

jobs:
  publish-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
      - name: Validate the release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG must match package.json version v$version." }
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Build verified Windows installer and update feed
        run: pnpm package:win:installer
      - name: Publish official Browsery release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-windows-release.mjs --publish
