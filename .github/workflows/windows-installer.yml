name: Build Browsery Windows installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a public GitHub release (off = private test build, installer saved as a workflow artifact only)
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: Browsery-windows-build-1.0.15

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
      - name: Read app version
        shell: bash
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Build verified Windows installer
        run: pnpm package:win:installer
      - name: Save installer and update feed
        uses: actions/upload-artifact@v7
        with:
          name: Browsery-Windows-installer
          path: |
            Browsery-windows-build-1.0.15/outputs/windows-setup-wizard-${{ env.APP_VERSION }}/Browsery-${{ env.APP_VERSION }}-x64.exe
            Browsery-windows-build-1.0.15/outputs/windows-setup-wizard-${{ env.APP_VERSION }}/latest.yml
            Browsery-windows-build-1.0.15/outputs/windows-setup-wizard-${{ env.APP_VERSION }}/Browsery-${{ env.APP_VERSION }}-x64.exe.blockmap
            Browsery-windows-build-1.0.15/outputs/windows-setup-wizard-${{ env.APP_VERSION }}/Browsery-${{ env.APP_VERSION }}-x64.exe.sha256
            Browsery-windows-build-1.0.15/outputs/windows-setup-wizard-${{ env.APP_VERSION }}/verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish Browsery release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$APP_VERSION"
          --target "$GITHUB_SHA"
          --title "Browsery $APP_VERSION"
          --notes-file ../.github/release-notes.md
          outputs/windows-setup-wizard-${{ env.APP_VERSION }}/Browsery-${{ env.APP_VERSION }}-x64.exe
          outputs/windows-setup-wizard-${{ env.APP_VERSION }}/latest.yml
          outputs/windows-setup-wizard-${{ env.APP_VERSION }}/Browsery-${{ env.APP_VERSION }}-x64.exe.blockmap
          outputs/windows-setup-wizard-${{ env.APP_VERSION }}/Browsery-${{ env.APP_VERSION }}-x64.exe.sha256
