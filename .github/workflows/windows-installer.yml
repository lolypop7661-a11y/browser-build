name: Build Browsery Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Browsery-windows-build-1.0.15

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Build verified Windows installer
        run: pnpm package:win:installer
      - name: Save installer and update feed
        uses: actions/upload-artifact@v7
        with:
          name: Browsery-Windows-installer
          path: |
            Browsery-windows-build-1.0.15/outputs/windows-setup-wizard-1.0.19/Browsery-1.0.19-x64.exe
            Browsery-windows-build-1.0.15/outputs/windows-setup-wizard-1.0.19/latest.yml
            Browsery-windows-build-1.0.15/outputs/windows-setup-wizard-1.0.19/Browsery-1.0.19-x64.exe.blockmap
            Browsery-windows-build-1.0.15/outputs/windows-setup-wizard-1.0.19/Browsery-1.0.19-x64.exe.sha256
            Browsery-windows-build-1.0.15/outputs/windows-setup-wizard-1.0.19/verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish Browsery 1.0.19
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v1.0.19
          --target "$GITHUB_SHA"
          --title "Browsery 1.0.19"
          --notes "20 new built-in extensions (Reader View, Night Shift, Focus Mode, Element Zapper and more), lower CPU, GPU and memory use with inactive-tab unloading, visual fixes, and a Cloudflare Turnstile human check in place of email confirmation."
          outputs/windows-setup-wizard-1.0.19/Browsery-1.0.19-x64.exe
          outputs/windows-setup-wizard-1.0.19/latest.yml
          outputs/windows-setup-wizard-1.0.19/Browsery-1.0.19-x64.exe.blockmap
          outputs/windows-setup-wizard-1.0.19/Browsery-1.0.19-x64.exe.sha256
