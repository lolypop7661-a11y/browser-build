name: Build Browsery Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: Browsery-mac-build-kit-1.0.0

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Build verified Windows installer
        run: pnpm package:win:installer
      - name: Save installer and update feed
        uses: actions/upload-artifact@v7
        with:
          name: Browsery-Windows-installer
          path: |
            Browsery-mac-build-kit-1.0.0/outputs/windows-*/*.exe
            Browsery-mac-build-kit-1.0.0/outputs/windows-*/*.blockmap
            Browsery-mac-build-kit-1.0.0/outputs/windows-*/latest.yml
            Browsery-mac-build-kit-1.0.0/outputs/windows-*/verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
