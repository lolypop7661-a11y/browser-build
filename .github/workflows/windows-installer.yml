name: Build Browsery Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Browsery-mac-build-kit-1.0.0

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron
        run: node node_modules/electron/install.js
      - name: Build Windows installer
        run: pnpm package:win:installer
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Browsery-Windows-installer
          path: Browsery-mac-build-kit-1.0.0/outputs/desktop/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Attach installer to Browsery release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload v1.0.0-macos
          outputs/desktop/*.exe
          --clobber
