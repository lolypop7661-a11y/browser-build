name: Build Browsery for Android

on:
  push:
    branches: [main]
    paths: ['Browsery-android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Version name, for example 1.0.0
        required: true
        default: '1.0.0'
      publish:
        description: Publish the APK as a GitHub pre-release (never marked latest, so the Windows updater is unaffected)
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: Browsery-android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ inputs.version || '1.0.0' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Keep one debug signing key between builds so new APKs install over old ones.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: browsery-android-debug-keystore-v1
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Show build errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|FAILED|Unresolved|> ' build.log | head -80 || true
      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Browsery-android-${VERSION_NAME}.apk"
          sha256sum "out/Browsery-android-${VERSION_NAME}.apk" | tee "out/Browsery-android-${VERSION_NAME}.apk.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: Browsery-android
          path: Browsery-android/out/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish pre-release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "android-v${VERSION_NAME}"
          --target "$GITHUB_SHA"
          --title "Browsery for Android ${VERSION_NAME}"
          --notes-file ../.github/android-release-notes.md
          --prerelease --latest=false
          out/Browsery-android-${VERSION_NAME}.apk
          out/Browsery-android-${VERSION_NAME}.apk.sha256
